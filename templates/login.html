
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicEye | Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080d1a;
            color: #e8eefb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #111b30;
            border: 1px solid #243957;
            border-radius: 15px;
            padding: 35px;
        }

        .logo {
            color: #4da6ff;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #91a2bd;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080d1a;
            border: 1px solid #29466b;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #268cff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0875e8;
        }

        .error {
            color: #ff8585;
            margin-bottom: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4da6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">CivicEye.</div>

        <h1>Admin Login</h1>
        <p class="subtitle">Sign in to manage community reports.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="password">Admin Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <a href="/" class="back">← Back to Home</a>
    </div>

</body>
</html>
